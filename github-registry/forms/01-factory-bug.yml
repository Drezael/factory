name: "Bug Report"
description: "Fehler melden – wird zuerst durch die Factory geplant"
title: "[Bug] "
labels: ["factory:bug"]
body:
  - type: markdown
    attributes:
      value: "Ein Bug wird zuerst geplant; erst die erzeugten Fix-Schritte werden entwickelt."
  - type: textarea
    id: defect
    attributes:
      label: Fehlerbeschreibung
      description: Was funktioniert nicht?
      placeholder: Beschreibe den Fehler und seine Auswirkungen.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Schritte zur Reproduktion
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Erwartetes Verhalten
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Tatsächliches Verhalten
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Umgebung, Versionen und Logs
      description: Keine Passwörter, Tokens oder personenbezogenen Daten einfügen.
    validations:
      required: false
